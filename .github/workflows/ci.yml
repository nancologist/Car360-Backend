# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Car360 CI

on:
  push:
    branches: [ "**" ] # all branches
  pull_request:
    branches: [ "**" ] # all branches

permissions:
  contents: read
  checks: write

jobs:

  ###########################################
  ############ JOB: Unit Tests ##############
  ###########################################
  unit-tests:
    name: Unit Tets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven target
        uses: actions/cache@v4
        id: cache-target
        with:
          path: target
          key: maven-${{ hashFiles('**/pom.xml', '**/*.java') }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: Run Unit Tests
        if: steps.cache-target.outputs.cache-hit != 'true'
        run: mvn test

      - name: Publish Unit Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tets Result
          path: target/surefire-reports/*.xml
          reporter: java-junit


  ##################################################
  ############ JOB: Integration Tests ##############
  ##################################################
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven target
        uses: actions/cache@v4
        id: cache-target
        with:
          path: target
          key: maven-${{ hashFiles('**/pom.xml', '**/*.java') }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: Run Integration Tests
        if: steps.cache-target.outputs.cache-hit != 'true'
        run: mvn verify

      - name: Publish Integration Test Results
        if: steps.cache-target.outputs.cache-hit != 'true'
        uses: dorny/test-reporter@v1
        with:
          name: Integration Tests Result
          path: target/failsafe-reports/TEST-*.xml
          reporter: java-junit


  ############################################
  ########### JOB: Code Quality ##############
  ############################################
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'
          cache: maven

      - name: Run Checkstyle and PMD checks
        run: mvn checkstyle:check pmd:check
      - uses: jwgmeligmeyling/checkstyle-github-action@master
        with:
          path: '**/checkstyle-result.xml'
      - uses: jwgmeligmeyling/pmd-github-action@master
        with:
          path: '**/pmd.xml'

  ##################################################
  ############ JOB: Dependency Check ###############
  ##################################################
  dependency-check:
    if: github.ref == 'refs/heads/main'
    name: Dependency Security Check
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'
          cache: maven

      - name: Run OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html


  ##################################################
  ############ JOB: Build Project ##################
  ##################################################
  build:
    if: github.ref == 'refs/heads/main'
    name: Build Project
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - code-quality
      - dependency-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests
