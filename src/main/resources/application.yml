logging:
  level:
    com.nancologist.car360: ${LOGGING_LEVEL_COM_NANCOLOGIST_CAR360}
#    root: ${LOGGING_LEVEL_ROOT}

spring:

  liquibase:
    change-log: ${SPRING_LIQUIBASE_CHANGE_LOG}
    default-schema: ${SPRING_LIQUIBASE_DEFAULT_SCHEMA}
    enabled: ${SPRING_LIQUIBASE_ENABLED}

  application:
    name: ${SPRING_APPLICATION_NAME}

  security:
    jwtSecret: ${SPRING_SECURITY_JWTSECRET}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

  jpa:
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA}
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          url: ${SPRING_DATASOURCE_URL}
          user: ${SPRING_DATASOURCE_USERNAME}
          password: ${SPRING_DATASOURCE_PASSWORD}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    show-sql: ${SPRING_JPA_SHOW_SQL}

  output:
    ansi:
      enabled: ${SPRING_OUTPUT_ANSI_ENABLED}
